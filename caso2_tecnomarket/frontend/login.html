<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="">
<title>Ingresar | TecnoMarket</title>
<link rel="stylesheet" href="../../compartido/css/base.css">
<link rel="stylesheet" href="css/tecnomarket.css">
<script src="../../compartido/js/tema.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<header class="cabecera" id="cabecera"></header>
<main>
<div class="autenticacion">
<div class="autenticacion__imagen"><img src="https://picsum.photos/seed/acceso/900/1100" alt="Lorem ipsum dolor"></div>
<form class="autenticacion__panel" id="form-login">
<h2>Ingresar</h2>
<label class="campo"><span class="campo__etiqueta">Usuario</span><input class="campo__control" name="username" autocomplete="username" required></label>
<label class="campo"><span class="campo__etiqueta">Contrasena</span><input class="campo__control" name="password" type="password" autocomplete="current-password" required></label>
<button class="boton boton--solido boton--ancho" type="submit"><i data-lucide="log-in"></i>Entrar</button>
</form>
</div>
</main>
<footer class="pie">
<div class="contenedor pie__legal">
<span>TecnoMarket. Desarrollo de Aplicaciones Web IS093A</span>
<span class="fila"><img class="tm-logo-pie" src="../../compartido/img/icon-uncp.png" alt="Lorem ipsum dolor"><img class="tm-logo-pie" src="../../compartido/img/icon-fis.png" alt="Lorem ipsum dolor"></span>
</div>
</footer>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
